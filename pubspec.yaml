name: jumpa_sini
description: JumpaSini — collaborative midpoint venue finder for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # HTTP client
  dio: ^5.7.0

  # Dependency injection
  get_it: ^8.0.2

  # Location
  geolocator: ^13.0.2
  google_maps_flutter: ^2.9.0
  flutter_google_places_sdk: ">=0.4.3 <2.0.0"

  # Local storage
  shared_preferences: ^2.3.3

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0

  # Functional programming
  dartz: ^0.10.1

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

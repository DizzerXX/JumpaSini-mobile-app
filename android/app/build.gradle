plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file("key.properties")
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withReader("UTF-8") { reader -> keyProperties.load(reader) }
}

android {
    namespace "com.jumpasini.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    signingConfigs {
        release {
            keyAlias keyProperties["keyAlias"]
            keyPassword keyProperties["keyPassword"]
            storeFile keyProperties["storeFile"] ? file(keyProperties["storeFile"]) : null
            storePassword keyProperties["storePassword"]
        }
    }

    defaultConfig {
        applicationId "com.jumpasini.app"
        minSdk 26
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // Maps SDK key for map rendering, injected into AndroidManifest.
        // Set MAPS_API_KEY in android/local.properties (gitignored) or as an env var
        // in CI. Empty means the map renders blank — the rest of the app still works,
        // since all Places/geocoding calls go through the backend proxy.
        manifestPlaceholders += [
            MAPS_API_KEY: localProperties.getProperty("MAPS_API_KEY")
                ?: (System.getenv("MAPS_API_KEY") ?: "")
        ]
    }

    buildTypes {
        release {
            // key.properties is gitignored, so it is absent on CI and fresh clones.
            // Fall back to debug signing there rather than failing the build: the APK
            // is still installable for testing, and a debug-signed build cannot be
            // published to Play, so this can't silently ship an unsigned release.
            signingConfig keyPropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
